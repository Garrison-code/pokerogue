# Only versioned resources can be reused without checking for updates.
map $uri $bundle_cache_control {
    default "no-cache";
    "~^/assets/.+-[A-Za-z0-9_-]{8,}\.(js|css)$" "public, max-age=31536000, immutable";
}
map $arg_t $static_cache_control {
    default $bundle_cache_control;
    "~^[a-f0-9]{64}$" "public, max-age=31536000, immutable";
}
server {
    listen 8000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    etag on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }
    location ~ ^/(index\.html|asset-manifest\.json|manifest\.json|runtime-config\.js|service-worker\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    # API traffic belongs to the separate backend route in Coolify.
    location = /api { return 404; }
    location /api/ { return 404; }
    location ~ ^/(src|node_modules|@vite|\.git)(/|$) { return 404; }
    location / {
        add_header Cache-Control $static_cache_control;
        try_files $uri $uri/ =404;
    }
}
