name: Publish container image

on:
  push:
    branches: [beta, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.repository == 'Garrison-code/pokerogue' &&
      (github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      # Build records are unnecessary artifacts for this image-only workflow.
      DOCKER_BUILD_RECORD_UPLOAD: "false"
      APP_TITLE: ${{ github.ref_name == 'develop' && 'PokéRogue (Garrix-dev)' || 'PokéRogue (Garrix)' }}
    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/beta' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,format=long,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build static image for validation
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.static
          platforms: linux/amd64
          load: true
          tags: pokerogue-static:check
          build-args: |
            VITE_APP_TITLE=${{ env.APP_TITLE }}
          cache-from: type=gha,scope=container-${{ github.ref_name }}

      - name: Validate static serving, runtime settings and caching
        shell: bash
        run: |
          docker run -d --name static-check -p 127.0.0.1:18000:8000 \
            -e VITE_SERVER_URL=/api -e VITE_BYPASS_LOGIN=0 \
            -e VITE_DISCORD_CLIENT_ID= -e VITE_GOOGLE_CLIENT_ID= pokerogue-static:check
          trap 'docker logs static-check; docker rm -f static-check' EXIT
          python3 container/check_static.py http://127.0.0.1:18000 "$APP_TITLE"

          docker rm -f static-check
          docker run -d --name static-check -p 127.0.0.1:18000:8000 \
            -e VITE_SERVER_URL=/api -e VITE_BYPASS_LOGIN=0 \
            -e VITE_DISCORD_CLIENT_ID= -e VITE_GOOGLE_CLIENT_ID= \
            -e 'VITE_APP_TITLE=Custom "Garrix" title' pokerogue-static:check
          python3 container/check_static.py http://127.0.0.1:18000 'Custom "Garrix" title'

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.static
          build-args: |
            VITE_APP_TITLE=${{ env.APP_TITLE }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=container-${{ github.ref_name }}
          cache-to: type=gha,mode=min,scope=container-${{ github.ref_name }}

      - name: Summarize published image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          {
            echo "### Published container image"
            echo
            echo 'Tags:'
            echo '~~~text'
            printf '%s\n' "$IMAGE_TAGS"
            echo '~~~'
            echo
            printf 'Pinned image: `%s@%s`\n' "$IMAGE_NAME" "$IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
