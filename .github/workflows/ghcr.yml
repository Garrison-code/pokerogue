name: Publish container image

on:
  push:
    branches: [beta, develop]
  workflow_dispatch:
    inputs:
      mode:
        description: Publish an image, check setup, or deploy the existing develop stack
        type: choice
        options: [publish, check, deploy]
        default: publish
      source_repository:
        description: Automatic publisher repository (leave empty for a manual request)
        type: string
        default: ''
      source_sha:
        description: Automatic publisher commit
        type: string
        default: ''
      source_run_id:
        description: Automatic publisher workflow run
        type: string
        default: ''
      resume:
        description: Force a manual retry or recover an unfinished deployment
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ (inputs.mode == 'deploy' || inputs.mode == 'check') && 'pokerogue-develop-deployment' || format('ghcr-{0}', github.ref) }}
  cancel-in-progress: ${{ inputs.mode != 'deploy' && inputs.mode != 'check' }}

jobs:
  quality:
    if: >-
      github.repository == 'Garrison-code/pokerogue' &&
      github.ref == 'refs/heads/develop' &&
      (inputs.mode == '' || inputs.mode == 'publish')
    runs-on: ubuntu-latest
    timeout-minutes: 17
    permissions:
      contents: read
      actions: read
    outputs:
      eligible: ${{ steps.gate.outputs.eligible }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Wait for required checks on this commit
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/publish_notify.py quality

  publish:
    needs: quality
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    if: >-
      always() && github.repository == 'Garrison-code/pokerogue' &&
      (inputs.mode == '' || inputs.mode == 'publish') &&
      (github.ref == 'refs/heads/beta' ||
       (github.ref == 'refs/heads/develop' && needs.quality.result == 'success' && needs.quality.outputs.eligible == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      actions: read
    env:
      # Build records are unnecessary artifacts for this image-only workflow.
      DOCKER_BUILD_RECORD_UPLOAD: "false"
      BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      APP_TITLE: ${{ github.ref_name == 'develop' && 'PokéRogue (Garrix-dev)' || 'PokéRogue (Garrix)' }}
    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/beta' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,format=long,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build static image for validation
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.static
          platforms: linux/amd64
          load: true
          tags: pokerogue-static:check
          build-args: |
            VITE_APP_TITLE=${{ env.APP_TITLE }}
            BUILD_REVISION=${{ github.sha }}
            BUILD_ID=${{ env.BUILD_ID }}
          cache-from: type=gha,scope=container-${{ github.ref_name }}

      - name: Validate static serving, runtime settings and caching
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_BUILD_ID: ${{ env.BUILD_ID }}
        shell: bash
        run: |
          docker run -d --name static-check -p 127.0.0.1:18000:8000 \
            -e VITE_SERVER_URL=/api -e VITE_BYPASS_LOGIN=0 \
            -e VITE_DISCORD_CLIENT_ID= -e VITE_GOOGLE_CLIENT_ID= pokerogue-static:check
          trap 'docker logs static-check; docker rm -f static-check' EXIT
          python3 container/check_static.py http://127.0.0.1:18000 "$APP_TITLE"

          docker rm -f static-check
          docker run -d --name static-check -p 127.0.0.1:18000:8000 \
            -e VITE_SERVER_URL=/api -e VITE_BYPASS_LOGIN=0 \
            -e VITE_DISCORD_CLIENT_ID= -e VITE_GOOGLE_CLIENT_ID= \
            -e 'VITE_APP_TITLE=Custom "Garrix" title' pokerogue-static:check
          python3 container/check_static.py http://127.0.0.1:18000 'Custom "Garrix" title'

      - name: Confirm develop is still current before publishing
        if: github.ref_name == 'develop'
        id: current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/publish_notify.py quality

      - name: Build and push image
        if: github.ref_name != 'develop' || steps.current.outputs.eligible == 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.static
          build-args: |
            VITE_APP_TITLE=${{ env.APP_TITLE }}
            BUILD_REVISION=${{ github.sha }}
            BUILD_ID=${{ env.BUILD_ID }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            io.garrix.build-id=${{ env.BUILD_ID }}
          cache-from: type=gha,scope=container-${{ github.ref_name }}
          cache-to: type=gha,mode=min,scope=container-${{ github.ref_name }}

      - name: Summarize published image
        if: steps.build.outputs.digest != ''
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          {
            echo "### Published container image"
            echo
            echo 'Tags:'
            echo '~~~text'
            printf '%s\n' "$IMAGE_TAGS"
            echo '~~~'
            echo
            printf 'Pinned image: %s@%s\n' "$IMAGE_NAME" "$IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

  registry-ready:
    needs: publish
    if: >-
      github.ref == 'refs/heads/develop' &&
      needs.publish.result == 'success' && needs.publish.outputs.image_digest != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.registry.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Confirm the published tag and build identity in GHCR
        id: registry
        env:
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          PUBLISHED_DIGEST: ${{ needs.publish.outputs.image_digest }}
        run: python3 .github/scripts/publish_notify.py published

  notify-develop:
    needs: [publish, registry-ready]
    if: >-
      vars.DEV_AUTO_DEPLOY_ENABLED == 'true' &&
      github.ref == 'refs/heads/develop' &&
      needs.registry-ready.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Notify the frontend coordinator after registry confirmation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          PUBLISHED_DIGEST: ${{ needs.publish.outputs.image_digest }}
        run: python3 .github/scripts/publish_notify.py notify

  deploy-develop:
    if: >-
      github.repository == 'Garrison-code/pokerogue' &&
      github.ref == 'refs/heads/develop' &&
      (inputs.mode == 'check' || inputs.mode == 'deploy')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: develop
    permissions:
      contents: read
      actions: write
      deployments: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEV_DEPLOY_GH_TOKEN: ${{ secrets.DEV_DEPLOY_GH_TOKEN }}
      DEPLOY_MODE: ${{ inputs.mode }}
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      RESUME: ${{ inputs.resume }}
      DEV_AUTO_DEPLOY_ENABLED: ${{ vars.DEV_AUTO_DEPLOY_ENABLED }}
      COOLIFY_READ_TOKEN: ${{ secrets.COOLIFY_READ_TOKEN }}
      COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
      DEV_SMOKE_USERNAME: ${{ secrets.DEV_SMOKE_USERNAME }}
      DEV_SMOKE_PASSWORD: ${{ secrets.DEV_SMOKE_PASSWORD }}
      DEV_SMOKE_CLIENT_ID: ${{ vars.DEV_SMOKE_CLIENT_ID }}
    steps:
      - name: Check out only deployment tooling
        id: checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts/
            container/check_static.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Validate publications, deduplicate and check unfinished deployments
        id: prepare
        run: python3 .github/scripts/dev_deploy.py prepare
      - name: Join Tailscale with short-lived OIDC identity
        if: steps.prepare.outputs.run == 'true'
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci-pokerogue-dev
          ping: 100.64.67.54
      - name: Check or deploy and verify the private dev service
        if: steps.prepare.outputs.run == 'true'
        run: python3 .github/scripts/dev_deploy.py execute
      - name: Upload deployment report without credentials or save contents
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: develop-deployment-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dev-deploy-report.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Record this deployment result
        if: always() && steps.checkout.outcome == 'success'
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 .github/scripts/dev_deploy.py finalize
  registry-ready-production:
    needs: publish
    if: >-
      always() &&
      github.ref == 'refs/heads/beta' &&
      needs.publish.result == 'success' && needs.publish.outputs.image_digest != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.registry.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Confirm the published tag and build identity in GHCR
        id: registry
        env:
          PROD_AUTO_DEPLOY_ENABLED: ${{ vars.PROD_AUTO_DEPLOY_ENABLED }}
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          PUBLISHED_DIGEST: ${{ needs.publish.outputs.image_digest }}
        run: python3 .github/scripts/publish_production.py published

  notify-production:
    needs: [publish, registry-ready-production]
    if: >-
      always() &&
      vars.PROD_AUTO_DEPLOY_ENABLED == 'true' &&
      github.ref == 'refs/heads/beta' &&
      needs.publish.result == 'success' &&
      needs.registry-ready-production.result == 'success' &&
      needs.registry-ready-production.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Notify the frontend coordinator after registry confirmation
        env:
          PROD_AUTO_DEPLOY_ENABLED: ${{ vars.PROD_AUTO_DEPLOY_ENABLED }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          PUBLISHED_DIGEST: ${{ needs.publish.outputs.image_digest }}
        run: python3 .github/scripts/publish_production.py notify

